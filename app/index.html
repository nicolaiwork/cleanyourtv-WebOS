#view {

#scroll {

#dock {

#grid {
  position: absolute;
  left: var(--grid-l);

  width: var(--grid-w);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  background: rgba(var(--night-rgb), var(--ov-dim));
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #scroll::before,
[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;
  opacity: 0;

  transition: opacity calc(0.25s * var(--spd)) linear;

}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
}
.snap .tile,
.snap .pill {

}
.tile .t {

  padding: 12px;

}
/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */
.tile.f {
  z-index: 3;
  box-shadow: 0 24px 36px rgba(0, 0, 0, 0.6);
}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));
  border: var(--ring-w) solid var(--focus);
  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}
#dock .tile.f::before {
  border-radius: calc(var(--dock-rad) + var(--ring-off) + var(--ring-w));
}
/* a tile that crops its picture (overflow: hidden) would cut the ring off: it gets a ring that sits against the tile */
.tile.fill.f::before {
  display: none;
}
.tile.fill.f {
  box-shadow:
    0 0 0 var(--ring-w) var(--focus),
    0 24px 36px rgba(0, 0, 0, 0.6);
}

  /* ---------- what the viewer did (kept in the service) ---------- */
  function isFav(c) {
    return S.fav.indexOf(c.key) >= 0;
  }
  function post(b) {
    api('/api/live/state', b).catch(function () {});
  }
  function toggleFav(c) {
    if (!c || !c.key) return;
    var on = !isFav(c);
    S.fav = S.fav.filter(function (k) {
      return k !== c.key;
    });
    if (on) S.fav.unshift(c.key);
    post({ op: 'fav', key: c.key, on: on });
    toastL(t(on ? 'Added to favourites' : 'Removed from favourites'));
    if (L.open) {
      L.list = listFor(L.g);
      L.ci = Math.max(0, Math.min(L.ci, L.list.length - 1));
      drawList();
    }
  }
  function markPlayed(c) {
    if (!c || !c.key) return;
    S.recent = [c.key]
      .concat(
        S.recent.filter(function (k) {
          return k !== c.key;
        })
      )
      .slice(0, 30);
    post({ op: 'recent', key: c.key });
    if (S.failed[c.key]) {
      delete S.failed[c.key];
      post({ op: 'failed', key: c.key, on: false });
    }
  }

  /* ---------- audio language and subtitles (player menu); the choice is remembered by language for every channel ---------- */
  /* Audio goes through the element's audioTracks (the TV switches its decoder). Subtitles, DVB teletext or bitmap, are not in
     textTracks: the TV's player lists them in com.webos.media/getPipelineState and draws them itself after selectTrack. */
  function pref(k) {
    try {
      return localStorage.getItem('live.' + k) || '';
    } catch (e) {
      return '';
    }
  }
  function setPref(k, v) {
    try {
      localStorage.setItem('live.' + k, v);
    } catch (e) {}
  }
  function audioList() {
    var a = video && video.audioTracks,
      out = [];
    if (a) for (var i = 0; i < a.length; i++) out.push(a[i]);
    return out;
  }
  function audioNow(list) {
    for (var i = 0; i < list.length; i++) if (list[i].enabled) return i;
    return 0;
  }
  function setAudio(i) {
    var list = audioList();
    if (!list[i]) return;
    list[i].enabled = true;
    for (var j = 0; j < list.length; j++) if (j !== i) list[j].enabled = false;
  }
  function setSub(i) {
    var id = video && video.mediaId;
    TR.sub = i;
    if (!id) return;
    if (i < 0) {
      LT.luna('luna://com.webos.media/setSubtitleEnable', { mediaId: id, enable: false });
      return;
    }
    LT.luna('luna://com.webos.media/selectTrack', { mediaId: id, type: 'text', index: TR.subs[i].index }, function () {
      LT.luna('luna://com.webos.media/setSubtitleEnable', { mediaId: id, enable: true });
    });
  }
  /* once a channel plays: the remembered audio language, then ask the TV's player for the subtitle tracks (they can take a moment) */
  function tracksStart() {
    var list = audioList(),
      a = LT.pick(
        list.map(function (x) {
          return x.language;
        }),
        pref('audio')
      );
    if (a >= 0 && !list[a].enabled) setAudio(a);
    askSubs(gen);
  }
  function askSubs(g) {
    var id = video && video.mediaId;
    if (!id) return;
    LT.luna('luna://com.webos.media/getPipelineState', { mediaId: id }, function (r) {
      if (g !== gen || !r) return;
      if (!LT.known(r) && TR.tries++ < 5) {
        TR.t = setTimeout(function () {
          askSubs(g);
        }, 1000);
        return;
      }
      TR.subs = LT.subs(r);
      var s = LT.pick(
        TR.subs.map(function (x) {
          return x.lang;
        }),
        pref('subs')
      );
      if (s >= 0) setSub(s);
      if (M.open) drawMenu();
    });
  }
  function tracksReset() {
    clearTimeout(TR.t);
    TR = { subs: [], sub: -1, tries: 0, t: 0 };
  }
  /* menu rows for the audio languages and subtitles, shown only when the stream has a choice */
  function trackItems() {
    var it = [],
      list = audioList();
    if (list.length > 1) {
      var names = LT.labels(
        list.map(function (x) {
          return x.language;
        }),
        t('Audio')
      );
      var stepA = function (d) {
        var i = (audioNow(list) + d + list.length) % list.length;
        setAudio(i);
        setPref('audio', LT.lang(list[i].language));
        drawMenu();
      };
      it.push({
        label: t('Audio'),
        sub: names[audioNow(list)],
        step: stepA,
        fn: function () {
          stepA(1);
        },
      });
    }
    if (TR.subs.length) {
      var subNames = LT.labels(
        TR.subs.map(function (x) {
          return x.lang;
        }),
        t('Subtitles')
      );
      var stepS = function (d) {
        var n = TR.subs.length + 1,
          i = ((TR.sub + 1 + d + n) % n) - 1; /* -1 is Off */
        setSub(i);
        setPref('subs', i < 0 ? '' : LT.lang(TR.subs[i].lang));
        drawMenu();
      };
      it.push({
        label: t('Subtitles'),
        sub: TR.sub < 0 ? t('Off') : subNames[TR.sub],
        step: stepS,
        fn: function () {
          stepS(1);
        },
      });
    }
    return it;
  }

  /* ---------- the player: one <video>, several streams per channel, tuning screen, recovery ---------- */
  /* One <video> element for the whole session: creating and destroying it on every channel change makes the TV rebuild its video plane. */
  var lastTime = -1;
  function ensureVideo() {
    if (video) return video;
    var v = document.createElement('video');
    v.autoplay = true;
    video = v;
    /* Not every TV fires 'playing' again after 'waiting' (or at all for some streams), so moving picture time counts as playing too */
    function onPlaying() {
      clearTimeout(spinT);
      clearTimeout(stallT);
      layer('lv-spin', false);
      layer('lv-tune', false);
      if (!started) {
        started = true;
        perfMark('live playing ' + (Date.now() - tuneAt) + ' variant ' + vi + (variants[vi] && variants[vi].type ? ' typed' : ' src'));
        tracksStart();
        clearTimeout(playedT);
        var c = byNum[cur];
        playedT = setTimeout(function () {
          markPlayed(c);
        }, 3000);
      }
    }
    v.addEventListener('playing', onPlaying);
    v.addEventListener('timeupdate', function () {
      if (v.currentTime !== lastTime) {
        lastTime = v.currentTime;
        if (v.currentTime > 0) onPlaying();
      }
    });
    v.addEventListener('waiting', function () {
      layer('lv-spin', true);
      if (started) {
        clearTimeout(stallT);
        stallT = setTimeout(stalled, STALL_MS);
      }
    });
    /* capture: a failing <source> reports on the <source>, and that event does not bubble; an old, removed <source> is ignored */
    v.addEventListener(
      'error',
      function (e) {
        if (e.target === v || e.target.parentNode === v) onError();
      },
      true
    );
    $('lv-stage').appendChild(v);
    return v;
  }
  function release() {
    tracksReset();
    clearTimeout(spinT);
    clearTimeout(beginT);
    clearTimeout(stallT);
    clearTimeout(playedT);
    clearTimeout(tuneT);
    pend = false;
    if (video) {
      try {
        video.pause();
        video.removeAttribute('src');
        while (video.firstChild) video.removeChild(video.firstChild);
        video.load();
      } catch (e) {}
      if (video.parentNode) video.parentNode.removeChild(video);
      video = null;
    }
  }
  function tuneText() {
    var c = byNum[cur];
    return t('Tuning...') + (streams.length > 1 ? '  ' + t('Stream') + ' ' + (si + 1) + '/' + streams.length : '');
  }
  function showTune() {
    var c = byNum[cur];
    $('lv-tune').textContent = (c ? c.name + '  ' : '') + tuneText();
    layer('lv-tune', true);
  }
  function stalled() {
    /* a live stream that stopped: reload it once, then move on */
    if (!video || pend || !started) return;
    if (reloads < 1) {
      reloads++;
      startVariant();
    } else onError();
  }
  function onError() {
    if (!video || pend) return;
    if (vi < variants.length - 1) {
      vi++;
      startVariant();
      return;
    }
    if (si < streams.length - 1) {
      si++;
      reloads = 0;
      variants = variantsFor(streams[si].url);
      vi = 0;
      startVariant();
      return;
    } /* the channel's next stream */
    giveUp();
  }
  function startVariant() {
    clearTimeout(spinT);
    clearTimeout(stallT);
    pend = false;
    started = false;
    lastTime = -1;
    var v = ensureVideo(),
      d = variants[vi];
    layer('lv-spin', true);
    showTune();
    while (v.firstChild) v.removeChild(v.firstChild);
    if (!d.type) {
      v.src = d.src;
    } else {
      v.removeAttribute('src');
      var src = document.createElement('source');
      src.src = d.src;
      src.type = d.type;
      v.appendChild(src);
      v.load();
    }
    spinT = setTimeout(function () {
      if (v === video && !started && !failed && !(v.readyState >= 3 && !v.paused)) onError();
    }, START_MS);
  }
  var WHY = {
    refused: 'The server refused the stream: it may be blocked in your country or need special request headers.',
    gone: 'The stream was not found (404): the channel is offline or its address has changed.',
    server: 'The stream server reported an error.',
    notvideo: 'The address answers with a web page, not a video.',
    drm: 'This stream is protected by DRM and cannot be played here.',
    unreachable: 'The stream server cannot be reached.',
    slow: 'The stream is too slow to start.',
    ok: 'The stream answers, but the TV could not play it: probably a format it cannot decode.',
    unknown: 'This channel is not available.',
  };
  function giveUp() {
    clearTimeout(spinT);
    clearTimeout(stallT);
    layer('lv-spin', false);
    layer('lv-tune', false);
    failed = true;
    var c = byNum[cur],
      g = gen;
    if (!c) return;
    if (c.key && !S.failed[c.key]) {
      S.failed[c.key] = Date.now();
      post({ op: 'failed', key: c.key, on: true });
    }
    var head = '<b>' + lesc(c.name) + '</b>',
      tail = '<div class="small">' + t('Press OK to try again.') + '</div>';
    msg(head + '<div>' + t('This channel is not available.') + '</div><div class="small">' + t('Checking why...') + '</div>');
    api('/api/live/probe?key=' + encodeURIComponent(c.key) + '&i=0').then(
      function (r) {
        if (g !== gen || !failed) return;
        msg(head + '<div>' + t(WHY[r.reason] || WHY.unknown) + '</div>' + tail);
      },
      function () {
        if (g === gen && failed) msg(head + '<div>' + t(WHY.unknown) + '</div>' + tail);
      }
    );
  }
  /* defer: while zapping (Up/Down) the new channel starts only once the keys have paused, so skipped channels never reach the provider */
  function play(num, quiet, defer) {
    var c = byNum[num];
    if (!c) return;
    gen++;
    tracksReset();
    cur = num;
    try {
      localStorage.setItem('live.last', String(num));
    } catch (e) {}
    tuneAt = Date.now();
    streams = [{ url: c.url, q: c.q }].concat(c.alt);
    si = 0;
    reloads = 0;
    failed = false;
    variants = variantsFor(c.url);
    vi = 0;
    layer('lv-msg', false);
    clearTimeout(beginT);
    clearTimeout(spinT);
    clearTimeout(stallT);
    clearTimeout(playedT);
    if (defer) {
      pend = true;
      if (video) {
        try {
          video.pause();
        } catch (e) {}
      }
      layer('lv-spin', true);
      showTune();
      beginT = setTimeout(function () {
        startVariant();
        loadEpg([c.id]);
      }, defer);
    } else {
      startVariant();
      loadEpg([c.id]);
    }
    if (!quiet) showOsd();
    else fillOsd();
  }
  function pickStream(i) {
    var c = byNum[cur];
    if (!c || i < 0 || i >= streams.length) return;
    gen++;
    failed = false;
    si = i;
    reloads = 0;
    variants = variantsFor(streams[si].url);
    vi = 0;
    layer('lv-msg', false);
    startVariant();
  }

  /* ---------- the banner ---------- */
  function hm(ts) {
    var d = new Date(ts * 1000);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function facts(c) {
    var a = [];
    if (c.cc) a.push(cname(c.cc));
    if (c.lang) a.push(c.lang);
    if (c.q) a.push(c.q);
    if (c.alt.length) a.push(c.alt.length + 1 + ' ' + t('streams'));
    return a.join('  ·  ');
  }
  function fillOsd() {
    var c = byNum[cur];
    if (!c) return;
    $('lv-onum').textContent = c.num;
    $('lv-oname').textContent = c.name;
    var lg = $('lv-ologo');
    if (c.logo) {
      lg.src = c.logo;
      lg.style.display = '';
    } else lg.style.display = 'none';
    var e = epgNow[c.id],
      now = Math.floor(Date.now() / 1000),
      f = facts(c);
    if (e && e.now) {
      $('lv-onow').textContent = hm(e.now[0]) + '  ' + e.now[2];
      $('lv-obar').style.width = Math.max(0, Math.min(100, ((now - e.now[0]) / (e.now[1] - e.now[0])) * 100)) + '%';
    } else {
      $('lv-onow').textContent = e ? '' : t('No guide data');
      $('lv-obar').style.width = '0';
    }
    $('lv-onext').textContent = e && e.next ? t('Next') + '  ' + hm(e.next[0]) + '  ' + e.next[2] : f;
    $('lv-ofacts').textContent = e && e.next ? f : '';
  }
  function showOsd() {
    fillOsd();
    layer('lv-osd', true);
    clearTimeout(osdT);
    osdT = setTimeout(function () {
      layer('lv-osd', false);
    }, 5500);
  }
  function loadEpg(ids, cb) {
    ids = ids.filter(function (i) {
      return i;
    });
    if (!ids.length) {
      cb && cb();
      return;
    }
    api('/api/live/epg?ids=' + encodeURIComponent(ids.join(',')))
      .then(function (x) {
        for (var k in x) epgNow[k] = x[k];
        if (byNum[cur] && ids.indexOf(byNum[cur].id) >= 0) fillOsd();
        cb && cb();
      })
      .catch(function () {
        cb && cb();
      });
  }
  setInterval(function () {
    if (o.on && byNum[cur]) loadEpg([byNum[cur].id]);
  }, 30000);

  /* ---------- the guide: tabs, favourites, recents, filters, search ---------- */
  var full = {};
  function cname(code) {
    try {
      if (window.Intl && Intl.DisplayNames) {
        var n = new Intl.DisplayNames([LOC], { type: 'region' }).of(code);
        if (n && n !== code) return n;
      }
    } catch (e) {}
    return code;
  }
  function passes(c) {
    if (F.cc && c.cc !== F.cc) return false;
    if (F.lang && c.lang !== F.lang) return false;
    if (F.q && c.q !== F.q) return false;
    if (Q) {
      var s = (c.name + ' ' + c.cc + ' ' + cname(c.cc || '') + ' ' + c.lang + ' ' + c.cats.join(' ')).toLowerCase();
      if (s.indexOf(Q) < 0) return false;
    }
    return true;
  }
  function baseList(g) {
    if (g === 0) return chans;
    if (g === 1)
      return S.fav
        .map(function (k) {
          return byKey[k];
        })
        .filter(Boolean);
    if (g === 2)
      return S.recent
        .map(function (k) {
          return byKey[k];
        })
        .filter(Boolean);
    var n = groups[g - 3];
    return chans.filter(function (c) {
      return c.cats.indexOf(n) >= 0;
    });
  }
  function listFor(g) {
    return baseList(g).filter(passes);
  }
  function tabNames() {
    return [t('All channels'), t('Favourites'), t('Recent')].concat(groups);
  }
  function gcolor() {
    var n = tabNames()[L.g],
      c = hsl2rgb(hashHue(n), 0.5, 0.42);
    $('lv-glow').style.setProperty('--c', c.join(','));
  }
  function openList() {
    L.open = true;
    var c = byNum[cur];
    L.g = 0;
    if (c && c.cats[0]) {
      var gi = groups.indexOf(c.cats[0]);
      if (gi >= 0) L.g = gi + 3;
    }
    L.list = listFor(L.g);
    L.ci = Math.max(0, L.list.indexOf(c));
    drawList();
    $('lv').classList.add('gd');
    layer('lv-guide', true);
    fetchVisible();
  }
  function closeList() {
    L.open = false;
    endSearch(false);
    FP.open = false;
    layer('lv-filter', false);
    $('lv').classList.remove('gd');
    layer('lv-guide', false);
  }
  function pct(p, now) {
    return Math.max(0, Math.min(100, ((now - p[0]) / (p[1] - p[0])) * 100));
  }
  var STAR = '<svg class="st" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg>';
  function badges(c) {
    var h = '';
    if (isFav(c)) h += STAR;
    if (c.q) h += '<span class="bd">' + c.q + '</span>';
    if (c.fl & 1) h += '<span class="bd w">GEO</span>';
    if (c.fl & 2) h += '<span class="bd w">NOT 24/7</span>';
    if (c.fl & 4) h += '<span class="bd w">HEADERS</span>';
    if (c.alt.length) h += '<span class="bd">×' + (c.alt.length + 1) + '</span>';
    if (c.key && S.failed[c.key]) h += '<span class="bd w">!</span>';

  }
  function filterText() {
    var a = [];
    if (F.cc) a.push(cname(F.cc));
    if (F.lang) a.push(F.lang);
    if (F.q) a.push(F.q);
    if (Q) a.push('“' + Q + '”');
    return a.join('  ·  ');
  }
  function drawList() {
    var now = Math.floor(Date.now() / 1000),

    if (L.g < names.length - 1) tabs += '<div class="ctab">' + lesc(names[L.g + 1]) + '</div><div class="ctab m">›</div>';

    setHtml($('lv-gtabs'), tabs);

    gcolor();
    var N = 7,
      cs = Math.max(0, Math.min(L.ci - 3, L.list.length - N)),

    for (var j = cs; j < Math.min(L.list.length, cs + N); j++) {
      var c = L.list[j],

        (c.logo ? '<img class="lg" src="' + lesc(c.logo) + '" alt="">' : '<div class="lg"></div>') +
        '<div class="t"><div class="nm">' +
        lesc(c.name) +

        (pn ? lesc(hm(pn[0]) + '  ' + pn[2]) : e ? '' : lesc(t('No guide data'))) +
        '</div>' +

  function drawDetail() {

    var f = full[c.id],
      now = Math.floor(Date.now() / 1000),

        '</div><div class="dg">' +
        lesc(c.cats.join(', ')) +
        '</div><div class="dg">' +
        lesc(facts(c)) +
        '</div>';
    if (f && f.list && f.list.length) {
      var p = f.list[0],

      h +=
        '<div class="card"><div class="dt">' +

        lesc(p[2]) +
        '</div>' +
        (p[3] ? '<div class="dd">' + lesc(p[3]) + '</div>' : '') +

        '</div>';
      if (f.list.length > 1) {

        for (var i = 1; i < Math.min(5, f.list.length); i++)
          h += '<div class="up"><div class="tm">' + hm(f.list[i][0]) + '</div><div class="tt">' + lesc(f.list[i][2]) + '</div></div>';
      }

    setHtml($('lv-detail'), h);
  }
  function fetchVisible() {
    clearTimeout(fetchT);
    fetchT = setTimeout(function () {
      var cs = Math.max(0, Math.min(L.ci - 3, L.list.length - 7)),
        ids = L.list
          .slice(cs, cs + 7)
          .map(function (c) {
            return c.id;
          })
          .filter(function (i) {
            return i && !epgNow[i];
          });
      if (ids.length)
        loadEpg(ids, function () {
          if (L.open) drawList();
        });
      var c = L.list[L.ci];
      if (c && c.id && !full[c.id])
        api('/api/live/epg?full=1&ids=' + encodeURIComponent(c.id))
          .then(function (x) {
            full[c.id] = x[c.id] || { list: [] };

          .catch(function () {});
    }, 160);
  }
  function relist() {
    L.list = listFor(L.g);
    L.ci = 0;
    drawList();

    if (on)
      setHtml(
        $('vd-early'),
        '<b>▶  Next episode</b>' +
          esc(VL.epCode(P.after.season, P.after.ep.num) + '  ·  ' + (P.after.ep.label || P.after.ep.title || '')) +
          '<div class="small">OK plays it  ·  Down hides this</div>'
      );
    player('vd-early', on);
  }
  function start(cur, at) {
    release();
    area = 'player';
    P = { cur: cur, at: at, started: false, failed: false, seek: null, seekN: 0, seekAt: 0, menu: null, subs: [], sub: -1, tries: 0 };
    hidePlayer();
    P.after = nextAfter(cur);
    player('vd-play', true);
    player('vd-spin', true);
    drawLoad(cur);
    var v = document.createElement('video');
    v.autoplay = true;
    P.video = v;
    v.addEventListener('loadedmetadata', function () {
      if (P && P.video === v && P.at > 0) v.currentTime = P.at;
    });
    function playing() {
      if (!P || P.video !== v || v.paused) return;
      player('vd-spin', false);
      if (!P.started && v.currentTime > 0) {
        P.started = true;
        clearTimeout(P.startT);
        player('vd-load', false);
        tracksStart();
      }
    }
    v.addEventListener('playing', playing);
    v.addEventListener('timeupdate', function () {
      playing();
      if (P && P.video === v && P.barOn) drawBar();
      if (P && P.video === v) early();
    });
    v.addEventListener('waiting', function () {
      if (P && P.video === v) player('vd-spin', true);
    });
    v.addEventListener('ended', function () {
      if (P && P.video === v) ended();
    });
    v.addEventListener(
      'error',
      function () {
        if (P && P.video === v && !P.started) fail();
      },
      true
    );
    v.src = /^https?:/.test(cur.play) ? cur.play : base + cur.play;
    $('vd-stage').appendChild(v);
    P.startT = setTimeout(function () {
      if (P && P.video === v && !P.started) fail();
    }, START_MS);
    P.saveT = setInterval(save, SAVE_MS);
    showBar(4000);
  }
  function fail() {
    player('vd-spin', false);
    player('vd-load', false);
    P.failed = true;
    var ext = P.cur.ext ? ' (.' + esc(P.cur.ext) + ')' : '';
    release(true);
    setHtml(
      $('vd-pmsg'),
      '<b>' + esc(P.cur.name) + "</b>This title can't be played on the TV" + ext + '.<div class="small">Press Back.</div>'
    );
    player('vd-pmsg', true);
  }
  /* stop the video and let go of the connection; keepP leaves the player's state for the message */
  function release(keepP) {
    if (!P) return;
    clearTimeout(P.startT);
    clearInterval(P.saveT);
    clearTimeout(P.barT);
    clearTimeout(P.seekT);
    clearTimeout(P.subT);
    clearInterval(P.nextT);
    var v = P.video;
    P.video = null;
    if (v) {
      try {
        v.pause();
        v.removeAttribute('src');
        v.load();
      } catch (e) {}
      if (v.parentNode) v.parentNode.removeChild(v);
    }
    if (!keepP) P = null;
  }
  function save(then) {
    var v = P && P.video;
    if (!v || !P.started) return then && then();
    var pos = P.seek !== null ? P.seek : v.currentTime,
      dur = duration(),
      c = P.cur;
    if (!VL.shouldSave(pos, dur)) return then && then();
    var b = { op: 'pos', kind: c.kind, id: c.id, pos: Math.floor(pos), dur: Math.floor(dur), name: c.name.slice(0, 200), poster: c.poster };
    if (c.kind === 'episode') {
      b.show = { id: c.show.id, name: c.show.name.slice(0, 200), poster: c.show.poster };
      b.season = c.season;
      b.num = c.num;
      b.next = c.next;
    }
    var w = VL.watched(pos, dur);
    api('/api/vod/state', b)
      .then(function () {
        if (w) return api('/api/vod/state', { op: 'watched', kind: c.kind, id: c.id, on: true });
      })
      .then(
        function () {
          if (then) then();
        },
        function () {
          if (then) then();
        }
      );
  }
  /* the bar: title, progress, elapsed / total, when it ends */
  function drawBar() {
    var v = P.video,
      dur = duration(),
      pos = P.seek !== null ? P.seek : v ? v.currentTime : 0,
      c = P.cur,
      title = c.kind === 'episode' ? c.show.name + '  ·  ' + VL.epCode(c.season, c.num) + '  ·  ' + c.name : c.name;
    $('vd-btitle').textContent = title;
    $('vd-bfill').style.transform = 'scaleX(' + (dur ? Math.min(1, pos / dur) : 0) + ')';
    $('vd-btime').textContent =
      VL.clock(pos) +
      (dur ? ' / ' + VL.clock(dur) + '    ends at ' + VL.endsAt(Date.now(), Math.max(0, dur - pos)) : '') +
      (v && v.paused && P.seek === null ? '    ❚❚ Paused' : '');
  }
  function showBar(ms) {
    P.barOn = true;
    drawBar();
    player('vd-bar', true);
    clearTimeout(P.barT);
    if (ms)
      P.barT = setTimeout(function () {
        if (P && P.video && !P.video.paused && P.seek === null) {
          P.barOn = false;
          player('vd-bar', false);
        }
      }, ms);
  }
  /* Left/Right: one seek once the keys rest, not one per key repeat (every seek is a new request to the provider) */
  function skip(dir) {
    var v = P.video;
    if (!v || !P.started) return;
    var now = Date.now();
    if (P.seek === null || now - P.seekAt > SEEK_MS) {
      if (P.seek === null) P.seek = v.currentTime;
      P.seekN = 0;
    }
    P.seekAt = now;
    P.seekN++;
    P.seek = Math.max(0, Math.min(duration() ? duration() - 2 : 1e9, P.seek + dir * VL.skipStep(P.seekN)));
    showBar();
    clearTimeout(P.seekT);
    P.seekT = setTimeout(function () {
      if (!P || !P.video) return;
      P.video.currentTime = P.seek;
      P.seek = null;
      showBar(3000);
    }, SEEK_MS);
  }
  function ended() {
    var c = P.cur;
    save(function () {
      var nx = nextAfter(c);
      if (!nx) return stop();
      release(true);
      player('vd-early', false);
      P.next = nx;
      P.nextN = NEXT_S;
      drawNext();
      player('vd-next', true);
      P.nextT = setInterval(function () {
        if (!P || !P.next) return;
        if (--P.nextN <= 0) return playNext();
        drawNext();
      }, 1000);
    });
  }
  function drawNext() {
    $('vd-next').innerHTML =
      '<div class="small">Next in ' +
      P.nextN +
      ' s</div><b>' +
      esc(VL.epCode(P.next.season, P.next.ep.num) + '  ·  ' + (P.next.ep.label || P.next.ep.title)) +
      '</b><div class="small">OK plays it now, Back stops</div>';
  }
  function playNext() {
    var n = P.next;
    player('vd-next', false);
    playFrom({ ep: n.ep, season: n.season, at: 0 });
  }
  /* back to the details, which now show Resume / ✓ */
  function stop() {
    var done = function () {
      release();
      hidePlayer();
      if (!o.on) return;
      area = 'details';
      loadState().then(function () {
        if (D && D.data) {
          if (D.kind === 'series') {
            var nx = VL.nextEpisode(D.data.seasons, ST.items);
            if (nx)
              for (var i = 0; i < D.data.seasons.length; i++)
                if (D.data.seasons[i].season === nx.season) {
                  D.si = i;
                  D.ei = Math.max(0, D.data.seasons[i].episodes.indexOf(nx.ep));
                }
          }
          D.group = 'btn';
          D.bi = 0;
          drawDetails();
        }
      });
    };
    if (P && P.video) save(done);
    else done();
  }

  /* audio language and subtitles, remembered with Live TV's choice (live.audio, live.subs) */
  function pref(k) {
    try {
      return localStorage.getItem('live.' + k) || '';
    } catch (e) {
      return '';
    }
  }
  function setPref(k, v) {
    try {
      localStorage.setItem('live.' + k, v);
    } catch (e) {}
  }
  function audioList() {
    var a = P && P.video && P.video.audioTracks,
      out = [];
    if (a) for (var i = 0; i < a.length; i++) out.push(a[i]);
    return out;
  }
  function audioNow(list) {
    for (var i = 0; i < list.length; i++) if (list[i].enabled) return i;
    return 0;
  }
  function setAudio(i) {
    var list = audioList();
    if (!list[i]) return;
    list[i].enabled = true;
    for (var j = 0; j < list.length; j++) if (j !== i) list[j].enabled = false;
  }
  function setSub(i) {
    var id = P && P.video && P.video.mediaId;
    P.sub = i;
    if (!id) return;
    if (i < 0) return LT.luna('luna://com.webos.media/setSubtitleEnable', { mediaId: id, enable: false });
    LT.luna('luna://com.webos.media/selectTrack', { mediaId: id, type: 'text', index: P.subs[i].index }, function () {
      LT.luna('luna://com.webos.media/setSubtitleEnable', { mediaId: id, enable: true }, function () {
        subStyle(id, 0);
      });
    });
  }
  /* The TV draws a film's subtitles itself, large and without an outline by default. This is the size Nicolai picked on the TV
     (2026-10-26): small, white, a thin black outline. Values found in the TV's media server (com.webos.media). */
  var SUB_STYLE = [
    ['setSubtitleCustomStyleEnable', { enable: true }],
    ['setSubtitleCharacterColor', { charColor: 'white' }],
    ['setSubtitleCharacterEdge', { charEdgeType: 'uniform' }],
    ['setSubtitleCharacterEdgeColor', { charEdgeColor: 'black' }],
    /* last: the size settings override each other (setSubtitleCharacterFontSize after this one undoes it) */
    ['setSubtitleFontSize', { fontSize: 0 }],
  ];
  function subStyle(id, n) {
    if (n >= SUB_STYLE.length || !P || !P.video || P.video.mediaId !== id) return;
    var p = { mediaId: id };
    for (var k in SUB_STYLE[n][1]) p[k] = SUB_STYLE[n][1][k];
    LT.luna('luna://com.webos.media/' + SUB_STYLE[n][0], p, function () {
      subStyle(id, n + 1);
    });
  }
  function tracksStart() {
    var list = audioList(),
      a = LT.pick(
        list.map(function (x) {
          return x.language;
        }),
        pref('audio')
      );
    if (a >= 0 && !list[a].enabled) setAudio(a);
    askSubs(P.video);
  }
  function askSubs(v) {
    var id = v && v.mediaId;
    if (!id) return;
    LT.luna('luna://com.webos.media/getPipelineState', { mediaId: id }, function (r) {
      if (!P || P.video !== v || !r) return;
      if (!LT.known(r) && P.tries++ < 5) {
        P.subT = setTimeout(function () {
          askSubs(v);
        }, 1000);
        return;
      }
      P.subs = LT.subs(r);
      var s = LT.pick(
        P.subs.map(function (x) {
          return x.lang;
        }),
        pref('subs')
      );
      if (s >= 0) setSub(s);
      if (P.menu) drawMenu();
    });
  }
  function menuItems() {
    var it = [],
      list = audioList();
    if (list.length > 1) {
      var names = LT.labels(
        list.map(function (x) {
          return x.language;
        }),
        'Audio'
      );
      var stepA = function (d) {
        var i = (audioNow(list) + d + list.length) % list.length;
        setAudio(i);
        setPref('audio', LT.lang(list[i].language));
      };
      it.push({ label: 'Audio', sub: names[audioNow(list)], step: stepA });
    }
    if (P.subs.length) {
      var subNames = LT.labels(
        P.subs.map(function (x) {
          return x.lang;
        }),
        'Subtitles'
      );
      var stepS = function (d) {
        var n = P.subs.length + 1,
          i = ((P.sub + 1 + d + n) % n) - 1; /* -1 is Off */
        setSub(i);
        setPref('subs', i < 0 ? '' : LT.lang(P.subs[i].lang));
      };
      it.push({ label: 'Subtitles', sub: P.sub < 0 ? 'Off' : subNames[P.sub], step: stepS });
    }
    if (!it.length) it.push({ label: 'No audio or subtitle choices', sub: '' });
    it.push({ label: 'Close', sub: '', close: true });
    return it;
  }
  function drawMenu() {
    P.menu.items = menuItems();
    if (P.menu.i >= P.menu.items.length) P.menu.i = P.menu.items.length - 1;
    var h = '<h3>' + esc(P.cur.name) + '</h3>';
    P.menu.items.forEach(function (m, i) {
      h +=
        '<div class="mrow' +
        (i === P.menu.i ? ' f' : '') +
        '"><div class="ml">' +
        esc(m.label) +
        '</div><div class="mv">' +
        esc(m.sub) +
        '</div></div>';
    });
    setHtml($('vd-menu'), h);
  }
  function menuKey(k) {
    var m = P.menu,
      row = m.items[m.i];
    if (k === 38 && m.i > 0) m.i--;
    else if (k === 40 && m.i < m.items.length - 1) m.i++;
    else if ((k === 37 || k === 39) && row.step) row.step(k === 37 ? -1 : 1);
    else if (k === 13 && row.step) row.step(1);
    else if ((k === 13 && row.close) || k === MENU_KEY || k === 113 || isBack(k)) {
      P.menu = null;
      player('vd-menu', false);
      return;
    }
    drawMenu();
  }
  function playerKey(k) {
    if (!P) return;
    if (P.menu) return menuKey(k);
    if (P.next) {
      if (k === 13) {
        clearInterval(P.nextT);
        playNext();
      } else if (isBack(k)) stop();
      return;
    }
    if (isBack(k)) return stop();
    if (P.failed || !P.video) return;
    var v = P.video;
    if (P.early && k === 13) {
      /* the next episode now: this one is saved (watched) first */
      var nx = P.after;
      return save(function () {
        if (!P || !o.on) return;
        P.next = nx;
        playNext();
      });
    }
    if (P.early && k === 40) {
      P.earlyOff = true;
      return early();
    }
    if (k === 13) {
      if (P.seek !== null || !P.started) return;
      if (v.paused) {
        v.play();
        showBar(3000);
      } else {
        v.pause();
        save();
        showBar();
      }
    } else if (k === 37 || k === 39) skip(k === 37 ? -1 : 1);
    else if (k === MENU_KEY || k === 113) {
      P.menu = { i: 0, items: [] };
      drawMenu();
      player('vd-menu', true);
    }
  }

  /* ---------- entering and leaving ---------- */
  o.enter = function () {
    o.on = true;
    $('vd').classList.add('on');
    area = 'rows';
    msg('Loading…');
    Promise.all([
      api('/api/vod/status'),
      loadState(),
      vget('/vod/library.json').then(
        function (l) {
          lib = l;
          HOME = {};
          BEC = {};
          CARDS = { films: {}, series: {} }; /* asked again each visit: the curator learns more about titles over time */
          if (!l.home) return;
          /* both tabs' rows at once (a few hundred kB): switching tabs is then instant */
          return Promise.all(
            KINDS.map(function (kind) {
              return vget('/vod/home/' + kind + '.json').then(
                function (h) {
                  HOME[kind] = h && h.rows && h.rows.length ? h.rows : null;
                },
                function () {
                  HOME[kind] = null;
                }
              );
            })
          );
        },
        function (e) {
          lib = null;
          throw e;
        }
      ),
    ]).then(
      function (r) {
        if (!o.on) return;
        base = r[0].base || base;
        msg('');
        setTab(tab === 2 ? (MEM.tab === 1 ? 1 : 0) : tab);
        area = rows.length ? 'rows' : 'tabs';
        drawTabs();
        drawRows();
      },
      function (e) {
        if (!o.on) return;
        area = 'tabs';
        drawTabs();
        msg('<b>The film library is not reachable</b>' + esc(e && e.message));
      }
    );
  };
  o.exit = function () {
    o.on = false;
    /* where each tab was left, for the next visit */
    if (tab < 2 && T[KINDS[tab]]) T[KINDS[tab]].ri = ri;
    for (var kd in T) MEM[kd] = VL.remember(T[kd].rows, T[kd].ri);
    if (tab < 2) MEM.tab = tab;
    keepMem();
    if (P) {
      save();
      release();
    }
    hidePlayer();
    closeTrailer();
    gen++;
    closeDetails();
    $('vd-q').blur();
    msg('');
    /* nothing kept while the launcher shows: rows, cards and pictures go, and come back on the next visit */
    rows = [];
    T = {};
    lib = null;
    S = { q: '', results: [], fi: 0, els: [] };
    $('vd-rows').textContent = '';
    $('vd-grid').textContent = '';
    $('vd-q').value = '';
    HOME = {};
    clearHero();
    $('vd').classList.remove('on');
  };
  /* webOS repeats keydown while OK is held, not always with e.repeat: a held OK is one press, so it can't open a title and then
     press Play (a stream) on its own */
  var okAt = 0;
  o.key = function (e) {
    var k = e.keyCode;
    if (k === 13) {
      var now = Date.now(),
        held = e.repeat || now - okAt < 400;
      okAt = now;
      if (held) {
        e.preventDefault();
        return;
      }
    }
    if (area === 'search') return searchKey(e);
    e.preventDefault();
    if (area === 'tabs') tabsKey(k);
    else if (area === 'rows') rowsKey(k);
    else if (area === 'sort') sortKey(k);
    else if (area === 'details') detailsKey(k);
    else if (area === 'results') resultsKey(k);
    else if (area === 'player') playerKey(k);
    else if (area === 'trailer') trailerKey(k);
  };
  /* the tile shows while the service knows a curator; asked again on every load(), since after a boot the service can start after
     the page, and the address can be set later */
  o.check = function () {
    api('/api/vod/status').then(
      function (s) {
        base = s.base || '';
        if (!!s.configured !== o.ready) {
          o.ready = !!s.configured;
          lastSig = '';
          load();
        }
      },
      function () {}
    );
  };
  o.check();
  return o;
})();
/* first paint straight from the last known layout, then refresh from the helper */
try {
  var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (cached && cached.apps && cached.apps.length) {
    apps = cached.apps;
    cfg = cached.cfg || {};
    applyTheme(cfg.theme);
    usage = cached.usage || {};
    colors = cached.colors || {};
    rebuild();
    perfMark('launcher cached ' + Math.round(performance.now()));
  }
} catch (e) {}
load();
wantInputs();
api('/api/frontend-ok', { version: VERSION }).catch(function () {}); // lets the manager know an updated launcher started
</script></body></html>
